name: Deploy relay to Oracle Cloud

# Run by hand only (Actions → "Deploy relay to Oracle Cloud" → Run workflow), by the repository owner.
# It is the one workflow a human runs on purpose; agents never trigger, re-run or watch it, and it
# never gets a push/pull_request/schedule trigger (docs/decisions/0005-manual-ci-and-release.md).
# It maps the repository secrets to scripts/deploy-relay-oci.sh's environment; see relay/README.md
# ("Oracle Cloud in one click") for the secrets to add.
on:
  workflow_dispatch:
    inputs:
      action:
        description: deploy (create or update the relay VM) or destroy (delete everything it created)
        type: choice
        options:
          - deploy
          - destroy
        default: deploy
      upgrade:
        description: >-
          deploy only: replace a slower relay VM (e.g. the 50 Mbit/s E2.1.Micro) with a faster one; the
          new VM starts next to the old one, which is terminated once the new one answers
        type: boolean
        default: false
      allow_paid:
        description: >-
          Allow billed resources (Pay As You Go): a paid 1 Gbit/s VM.Standard.E4/E5.Flex when A1 has no
          capacity, RELAY_OCPUS over the free allowance, storage over 200 GB. The cost is logged first
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-relay-oci
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Mask the relay token
        env:
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          if [ -n "$RELAY_TOKEN" ]; then echo "::add-mask::$RELAY_TOKEN"; fi
      - name: Install the OCI CLI
        run: pipx install oci-cli==3.95.0
      - name: Run scripts/deploy-relay-oci.sh
        env:
          ACTION: ${{ inputs.action }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          RELAY_HOST: ${{ vars.RELAY_HOST }}
          RELAY_OCPUS: ${{ vars.RELAY_OCPUS }}
          RELAY_ALLOW_PAID: ${{ inputs.allow_paid && '1' || '0' }}
          UPGRADE: ${{ inputs.upgrade && '1' || '0' }}
        run: |
          case "$ACTION" in
            deploy)
              if [ "$UPGRADE" = 1 ]; then
                scripts/deploy-relay-oci.sh --deploy --upgrade
              else
                scripts/deploy-relay-oci.sh --deploy
              fi
              ;;
            destroy) scripts/deploy-relay-oci.sh --destroy ;;
            *) echo "unknown action: $ACTION" >&2; exit 2 ;;
          esac
